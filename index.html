<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗诚的故事 - 正在加载...</title>
    <style>
        body {
            background: #141424;
            color: #f0f0fa;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
        }
        .loading h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .loading p {
            color: #b4b4c8;
        }
        .version-link {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .version-link a {
            color: rgb(233, 69, 96);
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgb(100, 100, 130);
            padding: 8px 16px;
            border-radius: 4px;
        }
        .version-link a:hover {
            background: rgb(45, 45, 68);
        }
    </style>
    <script>
        // 检测设备类型自动跳转
        (function() {
            var isMobile = /Android|iPhone|iPad|iPod|Windows Phone|Mobile|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
            var target = isMobile ? 'web-game-mobile/index.html' : 'web-game/index.html';
            window.location.href = target;
        })();
    </script>
</head>
<body>
    <div class="loading">
        <h1>罗诚的故事</h1>
        <p>正在加载游戏...</p>
        <div class="version-link">
            <a href="web-game/index.html">电脑版</a>
            <a href="web-game-mobile/index.html">手机版</a>
        </div>
    </div>
</body>
</html>
